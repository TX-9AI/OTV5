# v1.0  2026-10-24  CD.1 — THE ONE PLACE THIS TREE NAMES THE REPOSITORY IT IS INSTALLED FROM. A tree copied into a new
#       repository changes THIS line (and the two pinned copies below), or a fresh "unattended" install quietly
#       clones the old repository and still looks like a pass.
#       Read by: setup_ec2.sh (GITHUB_REPO default, the box's origin remote), deploy/install_claude.sh (renders
#       {{ORIGIN_REPO}} in the Claude settings templates).
#       PINNED COPIES (they run before any clone exists, so they cannot read this file):
#         deploy/install.sh        OT_DEFAULT_REPO=
#         bootstrap.example.sh     export GITHUB_REPO=
#       tests/check_origin.py fails when any of the three disagree, and drives install.sh / setup_ec2.sh to prove
#       the URL they actually clone is this one.
